events {}

http {
  # Docker's embedded DNS returns one A record per replica of "app".
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream algo_backend {
    zone algo_backend 64k;
    least_conn;                          # the same strategy you can simulate in the UI
    server app:8080 resolve max_fails=2 fail_timeout=5s;
    keepalive 32;
  }

  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;  # token/leaky bucket at the edge

  log_format json escape=json '{"time":"$time_iso8601","status":$status,"uri":"$request_uri",'
                              '"upstream":"$upstream_addr","rt":$request_time}';
  access_log /dev/stdout json;

  server {
    listen 80;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://algo_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_next_upstream error timeout http_502 http_503;
    }

    location / {
      proxy_pass http://algo_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }
  }
}
