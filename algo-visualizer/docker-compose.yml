# Local "mini cloud": 3 replicas behind an nginx load balancer + Prometheus + Grafana.
#   docker compose up --build
#   App:        http://localhost:8080   (refresh: the badge shows which replica answered)
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000   (anonymous viewer, dashboard "Algo Visualizer")
services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
    environment:
      CLOUD_REGION: docker-compose
      RATE_LIMIT_RPS: "20"
      RATE_LIMIT_BURST: "60"
    deploy:
      replicas: 3
      resources:
        limits: { cpus: "0.50", memory: 128M }
    read_only: true
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  lb:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [app]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [app]

  grafana:
    image: grafana/grafana:11.2.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
