name: algo-visualizer CI/CD

on:
  push:
    branches: [main]
    paths: ["algo-visualizer/**", ".github/workflows/algo-visualizer.yml"]
  pull_request:
    paths: ["algo-visualizer/**", ".github/workflows/algo-visualizer.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: algo-visualizer-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: algo-visualizer

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/algo-visualizer

jobs:
  test:
    name: Unit & API tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test

  iac:
    name: Validate Kubernetes & Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform (Kubernetes schema validation)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          kubectl kustomize k8s > rendered.yaml
          ./kubeconform -strict -summary -kubernetes-version 1.31.0 rendered.yaml
      - uses: hashicorp/setup-terraform@v3
      - name: terraform fmt & validate
        working-directory: algo-visualizer/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

  image:
    name: Build, smoke-test & scan image
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (tests run inside the Dockerfile)
        uses: docker/build-push-action@v6
        with:
          context: algo-visualizer
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name app -p 8080:8080 ${{ env.IMAGE }}:${{ github.sha }}
          for i in $(seq 1 20); do curl -fsS localhost:8080/healthz && break; sleep 1; done
          curl -fsS localhost:8080/api/info
          curl -fsS -X POST localhost:8080/api/sort -H 'content-type: application/json' \
               -d '{"algorithm":"quick","array":[3,1,2]}' | grep -q '"result":\[1,2,3\]'
          curl -fsS localhost:8080/metrics | grep -q http_requests_total
          docker stop -t 15 app   # exercises graceful shutdown
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && github.event_name != 'pull_request'
        with:
          sarif_file: trivy.sarif
      - name: Push to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag ${{ env.IMAGE }}:${{ github.sha }} ${{ env.IMAGE }}:latest
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

  deploy:
    name: Deploy to Kubernetes
    needs: [image, iac]
    # Opt-in: set repository variable DEPLOY_ENABLED=true and secret KUBECONFIG.
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production   # add required reviewers in repo settings for a manual approval gate
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config
      - name: Rolling update pinned to this commit
        run: |
          cd k8s
          kustomize edit set image ghcr.io/muhammadsagr/algo-visualizer=${{ env.IMAGE }}:${{ github.sha }}
          kubectl apply -k .
          kubectl -n algo-visualizer rollout status deployment/algo-visualizer --timeout=180s
      - name: Roll back on failure
        if: failure()
        run: kubectl -n algo-visualizer rollout undo deployment/algo-visualizer
