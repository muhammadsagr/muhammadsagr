<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"></head>
<body>
<title>Organizational X-Ray</title>
<meta name="description" content="Organizational X-Ray: تحليل الهيكل التنظيمي (Layers, Span of Control, Findings, What-If Simulator) في ملف واحد.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: a fixed instrument rail (navigation + global filters) beside a scrolling reading
   pane. The rail sits on the right because the page is right-to-left. */
:root {
  --bg: #f3f6f7;          /* light-box ground */
  --surface: #ffffff;
  --sunken: #eaeff1;
  --ink: #13212b;
  --ink-2: #4c5b66;
  --muted: #7d8a93;
  --line: #d9e1e5;
  --accent: #0b6e8a;      /* radiograph cyan */
  --accent-soft: #dcedf2;
  --accent-ink: #ffffff;
  --bar-2: #e2763f;       /* second series */
  --bar-3: #5a4bb0;       /* third series */
  --crit: #c9373a; --sig: #e0703f; --att: #c98a00; --info: #7d8a93;
  --crit-bg: #fbe4e3; --sig-bg: #fcebe1; --att-bg: #fbf1d6; --info-bg: #eceff1;
  --good: #1f8a4c;
  --font-body: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1317; --surface: #131d23; --sunken: #0f181d; --ink: #e4edf1; --ink-2: #a9b8c1; --muted: #7a8a94;
    --line: #24323a; --accent: #4fc1da; --accent-soft: #15333d; --accent-ink: #062028; --bar-2: #ef8a55; --bar-3: #9488ee;
    --crit: #ef6a6a; --sig: #f2915f; --att: #e8b53a; --info: #8d9aa3;
    --crit-bg: #3a1a1b; --sig-bg: #3a2418; --att-bg: #352a10; --info-bg: #1d282e; --good: #4cc27c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1317; --surface: #131d23; --sunken: #0f181d; --ink: #e4edf1; --ink-2: #a9b8c1; --muted: #7a8a94;
  --line: #24323a; --accent: #4fc1da; --accent-soft: #15333d; --accent-ink: #062028; --bar-2: #ef8a55; --bar-3: #9488ee;
  --crit: #ef6a6a; --sig: #f2915f; --att: #e8b53a; --info: #8d9aa3;
  --crit-bg: #3a1a1b; --sig-bg: #3a2418; --att-bg: #352a10; --info-bg: #1d282e; --good: #4cc27c; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono, code { font-family: var(--font-mono); font-size: .92em; unicode-bidi: isolate; direction: ltr; }
.num { font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 264px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; background: var(--surface);
  border-inline-end: 1px solid var(--line); padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { flex: none; }
.brand b { display: block; font-size: 15px; letter-spacing: .01em; white-space: nowrap; }
.brand small { color: var(--muted); font-size: 12px; }
.nav { display: grid; gap: 2px; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--ink-2); text-decoration: none; }
.nav a:hover { background: var(--sunken); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav a .en { margin-inline-start: auto; font-size: 11px; color: var(--muted); direction: ltr; white-space: nowrap; }
.rail h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.filters { display: grid; gap: 8px; }
.filters label { display: grid; gap: 2px; font-size: 12px; color: var(--ink-2); }
select, input[type="text"], input[type="number"], input[type="search"] { background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 8px; min-width: 0; width: 100%; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 6px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

main { padding-block: 28px 64px; padding-inline: 32px; min-width: 0; }
.page-head { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 24px; margin-bottom: 20px; }
.page-head h1 { margin: 0; font-size: 26px; line-height: 1.2; text-wrap: balance; }
.page-head h1 .en { color: var(--muted); font-weight: 400; font-size: 15px; margin-inline-start: 8px; direction: ltr; unicode-bidi: isolate; }
.page-head p { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
.filter-note { background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 6px 12px; font-size: 13px; margin-bottom: 16px; }
h2 { font-size: 17px; margin: 30px 0 10px; text-wrap: balance; }
h3 { font-size: 14px; margin: 0 0 8px; }
.sub { color: var(--muted); font-size: 12.5px; margin: -4px 0 10px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; min-width: 0; }
.kpi .k { color: var(--ink-2); font-size: 12.5px; }
.kpi .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.3; direction: ltr; text-align: right; }
.kpi .h { color: var(--muted); font-size: 11.5px; line-height: 1.4; }
.kpi.alert .v { color: var(--crit); }

.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; min-width: 0; }
.panel h3 + .sub { margin-top: -6px; }

.qa { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.qa a { display: block; text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; }
.qa a:hover { border-color: var(--accent); }
.qa .q { color: var(--ink-2); font-size: 12.5px; }
.qa .a { font-weight: 600; font-size: 15px; margin: 2px 0; }
.qa .e { color: var(--muted); font-size: 12px; line-height: 1.5; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 10px; }
.toolbar label { display: grid; gap: 2px; font-size: 12px; color: var(--ink-2); min-width: 150px; flex: 1 1 150px; max-width: 280px; }
.toolbar .grow { flex: 2 1 220px; max-width: none; }

.tablewrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); max-height: 460px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; text-align: start; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
td.wrap { white-space: normal; min-width: 260px; max-width: 520px; }
th { position: sticky; top: 0; background: var(--sunken); font-weight: 600; font-size: 12px; color: var(--ink-2); cursor: pointer; user-select: none; z-index: 1; }
th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px; }
th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px; }
td.n { font-variant-numeric: tabular-nums; text-align: end; direction: ltr; }
tbody tr:hover { background: var(--sunken); }
tbody tr.clickable { cursor: pointer; }
tbody tr.sel { background: var(--accent-soft); }
.tablefoot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin: 6px 0 4px; color: var(--muted); font-size: 12px; }

.sev { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 0 8px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.sev::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sev.Critical { color: var(--crit); background: var(--crit-bg); }
.sev.Significant { color: var(--sig); background: var(--sig-bg); }
.sev.Attention { color: var(--att); background: var(--att-bg); }
.sev.Informational { color: var(--info); background: var(--info-bg); }
.pill { display: inline-block; border-radius: 4px; padding: 0 6px; font-size: 12px; background: var(--sunken); color: var(--ink-2); }
.pill.ok { color: var(--good); }
.pill.bad { color: var(--crit); }

.chart { width: 100%; overflow-x: auto; }
.chart svg { display: block; max-width: 100%; height: auto; direction: ltr; }
.chart text { fill: var(--ink-2); font-family: var(--font-body); font-size: 11px; }
.chart .axis { stroke: var(--line); }
.chart .grid { stroke: var(--line); stroke-dasharray: 2 3; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-inline-end: 5px; vertical-align: -1px; }
.tip { position: fixed; pointer-events: none; z-index: 50; background: var(--ink); color: var(--bg); padding: 6px 9px; border-radius: 6px;
  font-size: 12px; line-height: 1.45; max-width: 320px; direction: rtl; white-space: pre-line; }

.detail { border: 1px solid var(--accent); border-radius: var(--r); background: var(--surface); padding: 16px 18px; margin-top: 14px; }
.detail .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin: 12px 0; }
.detail .facts div { background: var(--sunken); border-radius: 6px; padding: 8px 10px; min-width: 0; }
.detail .facts span { display: block; font-size: 11.5px; color: var(--muted); }
.detail .facts b { font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.evidence { background: var(--accent-soft); border-radius: 6px; padding: 10px 12px; }
.rule { font-family: var(--font-mono); font-size: 12.5px; background: var(--sunken); padding: 8px 10px; border-radius: 6px; direction: ltr; text-align: left; overflow-x: auto; }

.chain { display: grid; gap: 0; }
.chain .node { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--surface); }
.chain .node.sel { border-color: var(--accent); border-width: 2px; }
.chain .node small { color: var(--muted); display: block; }
.chain .up { color: var(--muted); padding-inline-start: 18px; line-height: 1.2; }
.warn { color: var(--crit); }
.okc { color: var(--good); }

.lines { font-size: 13px; direction: ltr; text-align: left; display: grid; gap: 2px; }
.scen { display: grid; gap: 6px; margin: 8px 0; }
.scen div { display: flex; gap: 8px; align-items: center; background: var(--sunken); border-radius: 6px; padding: 6px 10px; }
.scen span { flex: 1; min-width: 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px 14px; align-items: end; }
.formgrid label { display: grid; gap: 3px; font-size: 12.5px; color: var(--ink-2); }
.note { color: var(--muted); font-size: 12.5px; }
.err { color: var(--crit); background: var(--crit-bg); border-radius: 6px; padding: 8px 12px; }
.ok { color: var(--good); }
.netwrap { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); overflow: hidden; touch-action: none; }
.netwrap svg { display: block; width: 100%; height: 620px; cursor: grab; direction: ltr; }
.netwrap svg text { font-size: 10px; fill: var(--ink-2); font-family: var(--font-body); }
.drop { border: 1.5px dashed var(--line); border-radius: var(--r); padding: 22px; text-align: center; background: var(--surface); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; border-inline-end: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; }
  .nav { grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; padding-bottom: 4px; }
  .nav a .en { display: none; }
  .filters { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  main { padding-inline: 16px; padding-block: 20px 48px; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .netwrap svg { height: 460px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

</style>
<div class="app" dir="rtl" lang="ar">
  <aside class="rail">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true">
        <rect x="1" y="1" width="32" height="32" rx="7" fill="var(--accent)"/>
        <g stroke="var(--accent-ink)" stroke-width="1.6" fill="none" stroke-linecap="round">
          <path d="M17 9v5M10 19v-2.5h14V19M17 14v2.5"/>
        </g>
        <g fill="var(--accent-ink)"><circle cx="17" cy="8" r="2.6"/><circle cx="10" cy="21.5" r="2.4"/><circle cx="17" cy="21.5" r="2.4"/><circle cx="24" cy="21.5" r="2.4"/></g>

      <div><b>Organizational X-Ray</b><small>أشعة سينية على الهيكل التنظيمي</small></div>

  </aside>
  <main id="main"></main>
</div>

<script>
/* ===================================================================================
   Organizational X-Ray — analytics engine (pure JS, no DOM).
   Data -> Rules -> Calculations -> Evidence -> Findings
   =================================================================================== */
"use strict";

/* ---------------------------------------------------------------- configuration */
const COLUMNS = ["employee_id", "employee_name", "gender", "age", "hire_date", "employment_status",
  "job_title", "job_level", "grade", "department", "division", "business_unit", "location",
  "manager_id", "manager_name", "salary", "position_id", "position_status", "employment_type",
  "work_arrangement", "performance_rating", "years_of_service"];
const LABELS = {
  employee_id: "Employee ID", employee_name: "Name", gender: "Gender", age: "Age", hire_date: "Hire Date",
  employment_status: "Employment Status", job_title: "Job Title", job_level: "Job Level", grade: "Grade",
  department: "Department", division: "Division", business_unit: "Business Unit", location: "Location",
  manager_id: "Manager ID", manager_name: "Manager Name", salary: "Salary", position_id: "Position ID",
  position_status: "Position Status", employment_type: "Employment Type", work_arrangement: "Work Arrangement",
  performance_rating: "Performance Rating", years_of_service: "Years of Service",
  node_id: "Node ID", depth: "Depth", status: "Reporting Status", direct: "Direct Reports",
  vacDirect: "Vacant Direct Positions", total: "Total Reports", row_number: "Row",
};
const LEVEL_NAMES = { 0: "CEO", 1: "C-Suite", 2: "Directors", 3: "Senior Managers", 4: "Managers",
  5: "Supervisors", 6: "Individual Contributors" };
const SEVERITIES = ["Critical", "Significant", "Attention", "Informational"];
const FINDING_TYPES = ["CIRCULAR_REPORTING", "ORPHAN_EMPLOYEE", "INVALID_MANAGER", "TERMINATED_MANAGER",
  "HIGH_SPAN_OF_CONTROL", "LOW_SPAN_OF_CONTROL", "DEEP_HIERARCHY", "HIGH_MANAGEMENT_RATIO",
  "SMALL_DEPARTMENT", "DUPLICATE_POSITION", "VACANT_POSITION"];
const TYPE_AR = {
  LOW_SPAN_OF_CONTROL: "Span of Control منخفض", HIGH_SPAN_OF_CONTROL: "Span of Control مرتفع",
  DEEP_HIERARCHY: "تسلسل إداري عميق", ORPHAN_EMPLOYEE: "موظف بدون مدير", INVALID_MANAGER: "مدير غير موجود",
  TERMINATED_MANAGER: "مدير منتهي الخدمة", CIRCULAR_REPORTING: "علاقة إدارية دائرية",
  SMALL_DEPARTMENT: "وحدة تنظيمية صغيرة", HIGH_MANAGEMENT_RATIO: "نسبة مديرين مرتفعة",
  VACANT_POSITION: "وظيفة شاغرة", DUPLICATE_POSITION: "وظائف مكررة / متشابهة",
};
const RS = { CEO: "Top of Hierarchy", VALID: "Valid", MISSING: "Missing Manager", INVALID: "Invalid Manager",
  TERMINATED: "Terminated Manager", CIRCULAR: "Circular Reporting", DISCONNECTED: "Disconnected (upstream break)",
  INACTIVE: "Not Active", VACANT: "Vacant Position", DUP: "Duplicate ID (excluded)" };
const INVALID_RS = new Set([RS.MISSING, RS.INVALID, RS.TERMINATED, RS.CIRCULAR]);
const DEFAULT_SETTINGS = { low: 3, high: 12, deep: 6, small: 3, ratio: 0.20, similarity: 0.80,
  excludeExec: true, maxNodes: 600 };
const UNASSIGNED = "(Unassigned)";

/* ---------------------------------------------------------------- small helpers */
const isNum = (v) => typeof v === "number" && Number.isFinite(v);
const sum = (a) => a.reduce((s, x) => s + x, 0);
const mean = (a) => (a.length ? sum(a) / a.length : NaN);
function quantile(arr, q) {
  const a = arr.filter(isNum).sort((x, y) => x - y);
  if (!a.length) return NaN;
  const pos = (a.length - 1) * q, lo = Math.floor(pos), hi = Math.ceil(pos);
  return a[lo] + (a[hi] - a[lo]) * (pos - lo);
}
const median = (a) => quantile(a, 0.5);
const pct = (x, d = 1) => (isNum(x) ? (x * 100).toFixed(d) + "%" : "—");
const fmt = (x, d = 1) => (!isNum(x) ? "—" : Number.isInteger(x) ? x.toLocaleString("en-US")
  : x.toLocaleString("en-US", { maximumFractionDigits: d, minimumFractionDigits: d }));
const g = (v) => (isNum(v) ? String(+v.toFixed(2)) : "—");
function groupBy(arr, keyFn) {
  const m = new Map();
  for (const x of arr) { const k = keyFn(x); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
  return m;
}
const label = (v) => (v === "" || v == null ? UNASSIGNED : v);

/* ---------------------------------------------------------------- seeded random */
function makeRng(seed) {
  let a = seed >>> 0;
  const rnd = () => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const r = {
    random: rnd,
    int: (lo, hi) => lo + Math.floor(rnd() * (hi - lo + 1)),
    choice: (arr) => arr[Math.floor(rnd() * arr.length)],
    pick: (arr, p) => { let x = rnd() * sum(p); for (let i = 0; i < arr.length; i++) { x -= p[i]; if (x <= 0) return arr[i]; } return arr[arr.length - 1]; },
    normal: (m = 0, s = 1) => { const u = 1 - rnd(), v = rnd(); return m + s * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); },
    gamma: (k, theta) => { // Marsaglia–Tsang (k >= 1)
      const d = k - 1 / 3, c = 1 / Math.sqrt(9 * d);
      for (;;) { let x, v; do { x = r.normal(); v = 1 + c * x; } while (v <= 0);
        v = v * v * v; const u = rnd();
        if (u < 1 - 0.0331 * x ** 4 || Math.log(u) < 0.5 * x * x + d * (1 - v + Math.log(v))) return d * v * theta; }
    },
    shuffle: (arr) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; },
  };
  return r;
}

/* ===================================================================================
   Dummy organisation: structure first, then people, then deliberate issues
   =================================================================================== */
const FIRST_M = ["James", "Omar", "Daniel", "Khalid", "Michael", "Yousef", "David", "Tariq", "Robert", "Faisal",
  "William", "Hassan", "Richard", "Ahmed", "Thomas", "Saeed", "Mark", "Nasser", "Steven", "Ali", "Paul", "Majed",
  "Andrew", "Kareem", "Brian", "Sami", "Kevin", "Fahad", "Jason", "Adel", "Ryan", "Bilal", "Eric", "Hamza",
  "Jacob", "Rami", "Nathan", "Ziad", "Samuel", "Waleed"];

  "Information Technology": "Chief Information Officer", "Operations": "Chief Operating Officer",

const BASE_SALARY = { 0: 1800000, 1: 950000, 2: 480000, 3: 330000, 4: 245000, 5: 170000, 6: 110000 };

function generateOrg(nEmployees = 1500, seed = 42, asOf = new Date()) {
  const R = makeRng(seed);
  const scale = Math.max(0.3, nEmployees / 1500);
  const rows = [];
  let posSeq = 10001;
  const pool = R.shuffle(Array.from({ length: Math.round(3000 * Math.max(scale, 1)) + 2000 }, (_, i) => 10001 + i));
  const nextId = () => "E" + pool.pop();
  const listCounters = new Map();
  const count = (spec, sc = 1) => {
    let n;
    if (spec && spec.list) { const i = listCounters.get(spec) || 0; listCounters.set(spec, i + 1); n = spec.list[i % spec.list.length]; }
    else if (Array.isArray(spec)) n = R.int(spec[0], spec[1]);
    else n = spec || 0;
    return n ? Math.max(0, Math.round(n * sc)) : 0;
  };
  const loc = (d, parent) => {
    if (parent && R.random() < 0.8 && d.locations[parent]) return parent;
    return R.pick(Object.keys(d.locations), Object.values(d.locations));
  };
  const work = (d, level) => {
    if (level <= 3) return R.random() < 0.7 ? "On-site" : "Hybrid";
    const r = R.random();
    if (r < d.remote) return "Remote";
    return r < d.remote + d.onsite ? "On-site" : "Hybrid";
  };
  const add = ({ title, level, dept, division, bu, manager_id, location, salaryF = 1, vacant = false, wa = "On-site", type = null }) => {
    const row = Object.fromEntries(COLUMNS.map((c) => [c, ""]));
    Object.assign(row, { job_title: title, job_level: level, department: dept, division, business_unit: bu,
      manager_id, location, position_id: "P" + posSeq++ });
    const [lo, hi] = GRADE_RANGE[level];
    let grade = R.int(lo, hi);
    const senior = level === 6 && title.toLowerCase().startsWith("senior");
    if (senior) grade = Math.min(hi + 1, grade + 1);
    row.grade = "G" + grade;
    if (vacant) {
      Object.assign(row, { position_status: "Vacant", employee_id: "", employee_name: "", employment_status: "",
        employment_type: "", work_arrangement: "", salary: null, age: null, hire_date: "", performance_rating: null, years_of_service: null });
    } else {
      const male = R.random() < 0.64;
      const age = Math.round(Math.min(64, Math.max(21, R.normal(AGE_BY_LEVEL[level], 5.5))));
      const maxYos = Math.max(0, Math.min(age - 21, 28));
      const yos = Math.min(Math.max(R.gamma(2.2, 2.6 + (6 - level) * 0.9), 0.1), maxYos || 0.1);
      const hire = new Date(asOf.getTime() - yos * 365.25 * 864e5);
      let sal = BASE_SALARY[level] * salaryF * Math.exp(R.normal(0, 0.10)) * (1 + 0.012 * yos);
      if (senior) sal *= 1.2;
      Object.assign(row, {
        employee_name: `${R.choice(male ? FIRST_M : FIRST_F)} ${R.choice(LAST)}`, gender: male ? "Male" : "Female",
        age, hire_date: hire.toISOString().slice(0, 10), years_of_service: Math.round(yos * 10) / 10,
        position_status: "Filled", employment_status: R.random() < 0.035 ? "On Leave" : "Active",
        employment_type: type || (level === 6 ? R.pick(["Full-Time", "Contractor", "Part-Time"], [.86, .10, .04]) : "Full-Time"),
        work_arrangement: wa, salary: Math.round(sal / 100) * 100,
        performance_rating: R.pick([1, 2, 3, 4, 5], [.04, .14, .50, .24, .08]),
      });
    }
    rows.push(row);
    return row;
  };
  const buildUnit = (unit, d, managerId, parentLoc, isHead) => {
    const l = loc(d, parentLoc);
    const row = add({ title: unit.title, level: unit.level, dept: d.name, division: d.division, bu: d.bu,
      manager_id: managerId, location: l, salaryF: d.salaryF, wa: work(d, unit.level) });
    row.employee_id = nextId();
    const cs = isHead ? scale : 1;
    for (const [spec, child] of unit.children) {
      const n = count(spec, cs);
      for (let i = 0; i < n; i++) buildUnit(child, d, row.employee_id, l, false);
    }
    const nIc = count(unit.ics, isHead && !unit.children.length ? scale : 1);
    const titles = unit.ic_titles || d.ic_titles;
    for (let i = 0; i < nIc; i++) {
      const vacant = R.random() < d.vacancy;
      const ic = add({ title: R.choice(titles), level: 6, dept: d.name, division: d.division, bu: d.bu,
        manager_id: row.employee_id, location: loc(d, l), salaryF: d.salaryF, vacant, wa: work(d, 6) });
      if (!vacant) ic.employee_id = nextId();
    }
  };
  const EX = ["Executive Office", "Executive Office", "Corporate Services"];
  const exec = (title, level, mgr) => {
    const r = add({ title, level, dept: EX[0], division: EX[1], bu: EX[2], manager_id: mgr, location: "Riyadh", type: "Full-Time" });
    r.employee_id = nextId(); return r;
  };
  const ceo = exec("Chief Executive Officer", 0, "");
  exec("Executive Assistant", 6, ceo.employee_id); exec("Executive Assistant", 6, ceo.employee_id);
  for (const [division, title] of Object.entries(C_SUITE)) {
    const cx = exec(title, 1, ceo.employee_id);
    exec("Executive Assistant", 6, cx.employee_id);
    for (const d of DEPTS.filter((x) => x.division === division)) buildUnit(d.head, d, cx.employee_id, "Riyadh", true);
  }
  for (const d of DEPTS.filter((x) => x.division === "Governance")) buildUnit(d.head, d, ceo.employee_id, "Riyadh", true);
  const esgHead = add({ title: "Head of ESG & Sustainability", level: 2, dept: "ESG & Sustainability", division: "Governance",
    bu: "Corporate Services", manager_id: ceo.employee_id, location: "Riyadh", vacant: true });
  add({ title: "ESG Analyst", level: 6, dept: "ESG & Sustainability", division: "Governance", bu: "Corporate Services",
    manager_id: "VAC-" + esgHead.position_id, location: "Riyadh", vacant: true });

  const manifest = injectIssues(rows, R);
  const names = new Map(rows.filter((r) => r.employee_id).map((r) => [r.employee_id, r.employee_name]));
  for (const r of rows) {
    if (!r.manager_name) r.manager_name = r.manager_id.startsWith("VAC-") ? "(Vacant)" : names.get(r.manager_id) || "";
  }
  return { rows, manifest };
}

function injectIssues(rows, R) {
  const manifest = [];
  const used = new Set();
  const isMgr = () => new Set(rows.map((r) => r.manager_id));
  const nameOf = (id) => (rows.find((r) => r.employee_id === id) || {}).employee_name || "";
  const pickIcs = (dept, n) => {
    const mgrs = isMgr();
    const cand = rows.filter((r) => r.position_status === "Filled" && r.department === dept && r.job_level === 6
      && !used.has(r) && !mgrs.has(r.employee_id));
    const out = [];
    for (let i = 0; i < n; i++) { const j = Math.floor(R.random() * cand.length); out.push(cand.splice(j, 1)[0]); }
    out.forEach((r) => used.add(r));
    return out;
  };
  const push = (issue, expected, recs, dept, detail) => manifest.push({ issue, expected_finding: expected,
    ids: recs.map((r) => (typeof r === "string" ? r : r.employee_id)), department: dept, detail: detail || "" });

  for (const dept of ["Sales", "Infrastructure", "Supply Chain"]) {
    const [r] = pickIcs(dept, 1); r.manager_id = ""; r.manager_name = "";
    push("Missing Manager ID", "ORPHAN_EMPLOYEE", [r], dept);
  }
  ["Talent Acquisition", "Applications", "Customer Operations"].forEach((dept, k) => {
    const [r] = pickIcs(dept, 1); r.manager_id = "E" + (90001 + k);
    r.manager_name = `${R.choice(FIRST_M)} ${R.choice(LAST)}`;
    push("Manager ID not found", "INVALID_MANAGER", [r], dept, r.manager_id);
  });
  for (const [dept, title] of [["Customer Operations", "Customer Service Supervisor"], ["Marketing", "Marketing Manager"]]) {
    const sizes = new Map();
    rows.forEach((r) => sizes.set(r.manager_id, (sizes.get(r.manager_id) || 0) + 1));
    const m = rows.find((r) => r.department === dept && r.job_title === title
      && (sizes.get(r.employee_id) || 0) >= 3 && (sizes.get(r.employee_id) || 0) <= 13);
    m.employment_status = "Terminated"; // position left as "Filled" (stale HR record)
    const reports = rows.filter((r) => r.manager_id === m.employee_id && r.position_status === "Filled");
    reports.forEach((r) => used.add(r));
    push("Reports point to a terminated manager", "TERMINATED_MANAGER", reports, dept, m.employee_id);
  }
  const [a, b, c] = pickIcs("Marketing", 3);
  a.manager_id = b.employee_id; b.manager_id = c.employee_id; c.manager_id = a.employee_id;
  [a, b, c].forEach((r) => { r.manager_name = nameOf(r.manager_id); });
  push("Circular reporting (3-cycle)", "CIRCULAR_REPORTING", [a, b, c], "Marketing");
  const [s] = pickIcs("Data & Analytics", 1); s.manager_id = s.employee_id; s.manager_name = s.employee_name;
  push("Self-reporting (1-cycle)", "CIRCULAR_REPORTING", [s], "Data & Analytics");
  for (const dept of ["Accounting", "Sales"]) {
    const [x, y] = pickIcs(dept, 2); y.position_id = x.position_id;
    push("Duplicate Position ID", "DUPLICATE_POSITION", [x, y], dept, x.position_id);
  }
  const tl = rows.find((r) => r.job_title === "Team Lead");
  const team = rows.filter((r) => r.manager_id === tl.employee_id);
  team.forEach((r) => Object.assign(r, { position_status: "Vacant", employee_id: "", employee_name: "", employment_status: "",
    employment_type: "", work_arrangement: "", salary: null, age: null, performance_rating: null, years_of_service: null, hire_date: "" }));
  push("Manager-level position with no active reports (team vacant)", "VACANT_POSITION", [tl], "Applications", `${team.length} vacant positions`);
  { const [r] = pickIcs("HR Operations", 1); r.job_title = "hr analyst"; push("Job title case variant ('hr analyst')", "DUPLICATE_POSITION", [r], "HR Operations"); }
  for (const dept of ["Procurement", "Quality"]) { const [r] = pickIcs(dept, 1); r.job_title = ""; push("Missing job title", "DATA_QUALITY", [r], dept); }
  for (const dept of ["Supply Chain", "Customer Operations", "Sales"]) { const [r] = pickIcs(dept, 1); r.salary = null; push("Missing salary", "DATA_QUALITY", [r], dept); }
  { const [r] = pickIcs("Operations", 1); r.salary = 0; push("Salary = 0", "DATA_QUALITY", [r], "Operations"); }
  { const [r] = pickIcs("Applications", 1); r.department = ""; push("Missing department", "DATA_QUALITY", [r], "Applications"); }
  { const [r] = pickIcs("Accounting", 1);
    rows.push({ ...r, employee_name: `${R.choice(FIRST_F)} ${R.choice(LAST)}`, position_id: "P99001" });
    push("Duplicate Employee ID", "DATA_QUALITY", [r], "Accounting"); }
  return manifest;
}

const keyOf = (t) => String(t).trim().toLowerCase().replace(/[\s_\-./]+/g, "");
const ALIAS_LOOKUP = {};
for (const [c, list] of Object.entries(ALIASES)) { for (const a of list) ALIAS_LOOKUP[a] = c; ALIAS_LOOKUP[keyOf(c)] = c; }
const STATUS_MAP = { active: "Active", employed: "Active", onleave: "On Leave", leave: "On Leave", loa: "On Leave",
  terminated: "Terminated", inactive: "Terminated", resigned: "Terminated", exited: "Terminated", separated: "Terminated" };

const STR_COLS = ["employee_id", "employee_name", "gender", "employment_status", "job_title", "grade", "department",
  "division", "business_unit", "location", "manager_id", "manager_name", "position_id", "position_status",
  "employment_type", "work_arrangement", "hire_date"];

function mapColumns(headers) {
  const mapping = {}, taken = new Set();
  for (const h of headers) { const c = ALIAS_LOOKUP[keyOf(h)]; if (c && !taken.has(c)) { mapping[h] = c; taken.add(c); } }
  return mapping;
}
const cleanStr = (v) => (v == null ? "" : String(v).replace(/\s+/g, " ").trim().replace(/^(nan|None|NaN|null|undefined)$/, ""));
const cleanId = (v) => cleanStr(v).replace(/^(\d+)\.0$/, "$1");
function toNum(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return Number.isFinite(v) ? v : null;
  const n = Number(String(v).replace(/[,\s]/g, ""));
  return Number.isFinite(n) ? n : null;
}
const mapVal = (v, m) => (v ? m[keyOf(v)] || v : "");

/** Raw rows (objects with any headers) -> normalised records. Never throws on bad content. */
function normalize(rawRows) {
  const headers = rawRows.length ? Object.keys(rawRows[0]) : [];
  const mapping = mapColumns(headers);
  const recs = rawRows.map((raw, i) => {

function validateImport(rawRows) {

  if (!rawRows.length) { add("Error", "*", "الملف لا يحتوي على أي سجلات."); return { ok: false, issues, mapping: {} }; }
  const mapping = mapColumns(Object.keys(rawRows[0]));
  const present = new Set(Object.values(mapping));
  const required = ["employee_id", "employee_name", "manager_id", "job_title", "department", "division", "business_unit",

  for (const c of required) if (!present.has(c)) {
    const err = c === "employee_id" || c === "manager_id";
    issues.push({ level: err ? "Error" : "Warning", field: c, message: `العمود المطلوب '${LABELS[c]}' غير موجود في الملف.` + (err ? "" : " سيتم إنشاؤه فارغًا."), count: 0, rows: "" });
  }
  if (issues.some((i) => i.level === "Error")) return { ok: false, issues, mapping };
  const recs = normalize(rawRows);

  const idCount = new Map(); recs.forEach((r) => r.employee_id && idCount.set(r.employee_id, (idCount.get(r.employee_id) || 0) + 1));
  const dup = rn((r) => r.employee_id && idCount.get(r.employee_id) > 1); if (dup.length) add("Warning", "employee_id", "Employee ID مكرر (سيتم استبعاد التكرارات من التحليل الهيكلي).", dup);
  const ids = new Set(recs.map((r) => r.node_id));
  const bad = rn((r) => r.manager_id && !ids.has(r.manager_id)); if (bad.length) add("Warning", "manager_id", "Manager ID غير موجود ضمن أرقام الموظفين.", bad);
  const self = rn((r) => r.manager_id && r.manager_id === r.node_id); if (self.length) add("Warning", "manager_id", "الموظف مسجل كمدير لنفسه.", self);
  const roots = rn((r) => r.is_active && !r.manager_id);
  if (!roots.length) add("Warning", "manager_id", "لا يوجد موظف نشط بدون مدير؛ لا يمكن تحديد الـCEO.");
  else if (roots.length > 1) add("Info", "manager_id", "أكثر من موظف نشط بدون مدير؛ سيتم اختيار الـCEO تلقائيًا واعتبار الباقين Orphan Employees.", roots);
  const unk = rn((r) => !r.is_vacant && !["Active", "On Leave", "Terminated"].includes(r.employment_status));
  if (unk.length) add("Warning", "employment_status", "حالة وظيفية غير معروفة (المسموح: Active, On Leave, Terminated).", unk);
  const badDate = rn((r) => r._badDate); if (badDate.length) add("Warning", "hire_date", "تواريخ توظيف غير قابلة للقراءة.", badDate);
  if (!issues.length) add("Info", "*", "لم يتم العثور على مشكلات تمنع التحليل.");
  return { ok: !issues.some((i) => i.level === "Error"), issues, mapping };
}

function buildModel(recsIn) {

  for (const r of recs) if (!r.is_dup) byId.set(r.node_id, r);
  const inGraph = (id) => { const r = byId.get(id); return !!r && (r.is_active || r.is_vacant); };

  for (const r of recs) {
    if (r.is_dup || !(r.is_active || r.is_vacant)) continue;
    children.set(r.node_id, children.get(r.node_id) || []);
    if (r.manager_id && inGraph(r.manager_id)) {
      parent.set(r.node_id, r.manager_id);
      if (r.manager_id !== r.node_id) {
        if (!children.has(r.manager_id)) children.set(r.manager_id, []);
        children.get(r.manager_id).push(r.node_id);

    }
  }
  // cycles in a functional graph (each node has at most one manager)
  const color = new Map(), cycles = [], inCycle = new Set();

    if (color.get(start)) continue;
    const path = []; let cur = start;
    while (cur !== undefined && !color.get(cur)) { color.set(cur, 1); path.push(cur); cur = parent.get(cur); }
    if (cur !== undefined && color.get(cur) === 1) { // closed a new loop
      const loop = path.slice(path.indexOf(cur));
      const i = loop.indexOf([...loop].sort()[0]);
      const rot = loop.slice(i).concat(loop.slice(0, i)); // reporting order: employee -> manager -> ...
      cycles.push(rot); rot.forEach((n) => inCycle.add(n));
    }
    path.forEach((n) => color.set(n, 2));
  }
  // CEO
  const roots = recs.filter((r) => r.is_active && !r.manager_id && !inCycle.has(r.node_id));
  const desc = (id) => { let n = 0; const st = [id]; const seen = new Set([id]);
    while (st.length) for (const c of children.get(st.pop()) || []) if (!seen.has(c)) { seen.add(c); n++; st.push(c); } return n; };

  if (roots.length === 1) ceo = roots[0].node_id;
  else if (roots.length > 1) {
    ceo = roots.map((r) => ({ id: r.node_id, lvl: r.job_level ?? 99, t: /\b(CEO|Chief Executive)/i.test(r.job_title) ? 0 : 1, s: -desc(r.node_id) }))
      .sort((a, b) => a.lvl - b.lvl || a.t - b.t || a.s - b.s)[0].id;

  }

    cyc.forEach((m) => total.set(m, comp - (active(m) ? 1 : 0)));
  }
  for (const k of children.keys()) if (!total.has(k)) total.set(k, acc.get(k)); // below a loop
  // enrich records
  for (const r of recs) {
    const id = r.node_id, mid = r.manager_id, m = byId.get(mid);
    let st;
    if (r.is_dup) st = RS.DUP;
    else if (r.is_vacant) st = RS.VACANT;
    else if (!r.is_active) st = RS.INACTIVE;
    else if (id === ceo) st = RS.CEO;
    else if (inCycle.has(id)) st = RS.CIRCULAR;
    else if (!mid) st = RS.MISSING;
    else if (!m) st = RS.INVALID;
    else if (!m.is_active && !m.is_vacant) st = RS.TERMINATED;
    else st = depth.has(id) ? RS.VALID : RS.DISCONNECTED;

    const inG = !r.is_dup && (r.is_active || r.is_vacant);
    r.depth = !r.is_dup && depth.has(id) ? depth.get(id) : null;
    r.direct = inG ? direct.get(id) || 0 : 0;
    r.vacDirect = inG ? vacDirect.get(id) || 0 : 0;
    r.total = inG ? total.get(id) || 0 : 0;

}

// difflib.SequenceMatcher.ratio (Ratcliff/Obershelp)
function seqRatio(a, b) {
  const matches = (a1, a2, b1, b2) => {
    let best = 0, bi = 0, bj = 0;
    for (let i = a1; i < a2; i++) for (let j = b1; j < b2; j++) {
      let k = 0; while (i + k < a2 && j + k < b2 && a[i + k] === b[j + k]) k++;
      if (k > best) { best = k; bi = i; bj = j; }
    }
    if (!best) return 0;
    return best + matches(a1, bi, b1, bj) + matches(bi + best, a2, bj + best, b2);
  };

  return t ? (2 * matches(0, a.length, 0, b.length)) / t : 1;
}
const SENIORITY = new Set(["senior", "sr", "junior", "jr", "staff", "lead", "principal", "chief", "head", "assistant", "associate", "i", "ii", "iii"]);
const STOP = new Set(["&", "and", "of", "the", "-", ","]);

const coreTitle = (n) => n.split(" ").filter((w) => !SENIORITY.has(w)).join(" ");

  const w = n.split(" ").filter((x) => !STOP.has(x));
  if (w.length < 2) return n;
  return w.slice(0, -1).map((x) => (x.includes("&") ? x.replace(/&/g, "") : x[0])).join("") + " " + w[w.length - 1];
}

  if (acronymForm(na) === acronymForm(nb) && na.split(" ").length !== nb.split(" ").length) return 0.95;
  const ta = na.split(" ").filter((w) => !STOP.has(w)), tb = nb.split(" ").filter((w) => !STOP.has(w));
  const sa = new Set(ta), sb = new Set(tb);
  const ratio = seqRatio(na, nb);
  const subset = (x, y) => x.size < y.size && [...x].every((w) => y.has(w));

  if (da.length === 1 && db.length === 1 && ta.length === tb.length && seqRatio(da[0], db[0]) >= 0.5) return ratio;

}

  const rows = recs.filter((r) => (r.is_active || r.is_vacant) && !r.is_dup && r.job_title);
  const byTitle = groupBy(rows, (r) => r.job_title);
  const titles = [...byTitle].map(([t, rs]) => ({ job_title: t, positions: rs.length,
    departments: [...new Set(rs.map((r) => r.department).filter(Boolean))].sort().join(", "), normalized: normTitle(t) }))
    .sort((a, b) => b.positions - a.positions);

  for (const [norm, grp] of groupBy(titles, (t) => t.normalized)) if (grp.length > 1)
    variants.push({ normalized_title: norm, variants: grp.map((t) => t.job_title).join(" | "), positions: sum(grp.map((t) => t.positions)),
      departments: [...new Set(grp.flatMap((t) => t.departments.split(", ")).filter(Boolean))].sort().join(", ") });

    F({ type: "INVALID_MANAGER", severity: "Significant", entity_type: "Employee", entity_id: r.node_id, entity_name: nameOf(r), department: r.department,
      description: `Manager ID (${r.manager_id}) غير موجود في البيانات (Invalid Reporting Relationship).`,
      evidence: `Manager ID = ${r.manager_id}، Manager Name المسجل = '${r.manager_name || "—"}'. لا يوجد أي سجل بهذا الرقم. رقم السجل في الملف = ${r.row_number}.`,
      recommended: "التحقق من صحة رقم المدير (خطأ إدخال، مدير لم يُنقل للنظام، أو رقم قديم).",
      rule: "manager_id not found among Employee IDs", metric: "Manager ID", value: r.manager_id, related: [r.node_id] });
  for (const [mid, grp] of groupBy(recs.filter((x) => x.status === RS.TERMINATED), (r) => r.manager_id)) {
    const m = model.byId.get(mid);
    F({ type: "TERMINATED_MANAGER", severity: "Significant", entity_type: "Manager", entity_id: mid, entity_name: nameOf(m), department: m.department,
      description: `${grp.length} موظف/موظفين ما زالوا يتبعون مديرًا حالته الوظيفية '${m.employment_status}' (Invalid Reporting Relationship).`,
      evidence: `المدير ${mid} – ${m.employee_name}: Employment Status = ${m.employment_status}، Position Status = ${m.position_status}. الموظفون المتأثرون: ${grp.slice(0, 15).map((r) => r.node_id).join(", ")}${grp.length > 15 ? " …" : ""}.`,
      recommended: "تحديد المدير البديل أو المكلف، وتحديث Manager ID للموظفين، ومراجعة حالة الوظيفة (قد تكون شاغرة فعليًا).",
      rule: "manager record exists but Employment Status is not Active / On Leave", metric: "Affected employees", value: grp.length,
      related: [mid, ...grp.map((r) => r.node_id)] });
  }
  // span
  let scope = mgrs.filter((r) => r.status !== RS.CIRCULAR);
  if (s.excludeExec) scope = scope.filter((r) => r.job_level !== 0 && r.job_level !== 1);
  for (const r of scope) {
    const n = r.direct;
    const common = `الوسيط التنظيمي لـSpan of Control = ${g(orgMedian)}. إجمالي التابعين (مباشر وغير مباشر) = ${r.total}. وظائف شاغرة تابعة مباشرة = ${r.vacDirect}. Job Level = ${lvl(r.job_level)}.`;
    const rel = [r.node_id, ...directIds(model, r.node_id)];
    if (n <= s.low) F({ type: "LOW_SPAN_OF_CONTROL", severity: n === 1 ? "Attention" : "Informational", entity_type: "Manager", entity_id: r.node_id,
      entity_name: nameOf(r), department: r.department,
      description: `تم اكتشاف Span of Control منخفض ويحتاج إلى مراجعة: لدى هذا المدير ${n} موظف/موظفين مباشرين، مقارنة بالحد المحدد حاليًا وهو ${s.low}.`,
      evidence: `عدد الموظفين المباشرين النشطين = ${n}. ${common}`,
      recommended: "مراجعة سبب محدودية نطاق الإشراف: هل الدور تخصصي أو قيادي فني؟ هل توجد وظائف شاغرة ستُشغل قريبًا؟ هل يمكن دمج الفريق مع فريق مجاور؟ النتيجة لا تعني أن الدور غير ضروري.",
      rule: `direct_reports <= Low Span Threshold (${s.low})`, metric: "Direct Reports", value: n, threshold: s.low,
      benchmark: `Organizational median = ${g(orgMedian)}`, related: rel });
    else if (n > s.high) { const ratio = n / s.high;
      F({ type: "HIGH_SPAN_OF_CONTROL", severity: ratio <= 1.5 ? "Attention" : ratio <= 2.5 ? "Significant" : "Critical", entity_type: "Manager",
        entity_id: r.node_id, entity_name: nameOf(r), department: r.department,
        description: `تم اكتشاف Span of Control مرتفع: لدى هذا المدير ${n} موظفًا مباشرًا مقارنة بالحد المحدد حاليًا وهو ${s.high} وبوسيط تنظيمي يبلغ ${g(orgMedian)}.`,
        evidence: `هذا المدير لديه ${n} موظفًا مباشرًا مقارنة بوسيط تنظيمي يبلغ ${g(orgMedian)} (أي ${(n / orgMedian).toFixed(1)}× الوسيط). ${common}`,
        recommended: "مراجعة طبيعة العمل (عمل متجانس/تشغيلي قد يتحمل نطاقًا أوسع)، وجود قادة فرق غير رسميين، وعبء الإشراف والتقييم على المدير.",
        rule: `direct_reports > High Span Threshold (${s.high})`, metric: "Direct Reports", value: n, threshold: s.high,
        benchmark: `Organizational median = ${g(orgMedian)}`, related: rel }); }
  }
  // deep hierarchy
  const reach = recs.filter((r) => r.is_active && r.depth != null);
  const dMed = median(reach.map((r) => r.depth)), dMax = reach.length ? Math.max(...reach.map((r) => r.depth)) : NaN;
  for (const [dept, grp] of groupBy(reach, (r) => r.department)) {
    const deep = grp.filter((r) => r.depth > s.deep); if (!deep.length) continue;
    const maxD = Math.max(...grp.map((r) => r.depth));
    const deepest = [...grp].sort((a, b) => b.depth - a.depth || (a.node_id < b.node_id ? -1 : 1))[0];
    const chain = chainUp(model, deepest.node_id).reverse().map((n) => (model.byId.get(n) || {}).job_title || n).join(" ← ");
    F({ type: "DEEP_HIERARCHY", severity: maxD - s.deep === 1 ? "Attention" : "Significant", entity_type: "Department", entity_id: label(dept),
      entity_name: label(dept), department: dept,
      description: `تم اكتشاف تسلسل إداري عميق (Deep Reporting Chain): أقصى عمق في الإدارة ${maxD} علاقات إدارية حتى الـCEO، مقارنة بالحد المحدد ${s.deep}.`,
      evidence: `${deep.length} موظف/موظفين على عمق أكبر من ${s.deep}. عدد الطبقات في الإدارة = ${new Set(grp.map((r) => r.depth)).size}. الوسيط التنظيمي للعمق = ${g(dMed)}، والحد الأقصى على مستوى المنظمة = ${dMax}. أطول سلسلة: ${chain}.`,
      recommended: "مراجعة ما إذا كانت كل طبقة تضيف نطاق مسؤولية مختلفًا، وهل توجد مسميات متتالية بنفس المستوى الوظيفي (مثل Senior Director ثم Director)، وأثر العمق على سرعة القرار.",
      rule: `employee depth > Deep Hierarchy Threshold (${s.deep})`, metric: "Max Depth", value: maxD, threshold: s.deep,
      benchmark: `Organizational median depth = ${g(dMed)}`, related: deep.map((r) => r.node_id) });
  }
  // units
  const units = unitMetrics(recs, "department", s);
  const actAll = recs.filter((r) => r.is_active);
  const orgRatio = actAll.filter((r) => r.isMgr).length / actAll.length;
  const medHc = median(units.map((u) => u.headcount));
  for (const u of units) {
    const dept = u.department;
    const members = recs.filter((r) => label(r.department) === dept && (r.is_active || r.is_vacant) && !r.is_dup).map((r) => r.node_id);
    if (u.headcount <= s.small)
      F({ type: "SMALL_DEPARTMENT", severity: u.headcount === 0 ? "Attention" : "Informational", entity_type: "Department", entity_id: dept, entity_name: dept, department: dept,
        description: `Small Organizational Unit: عدد الموظفين النشطين في الإدارة = ${u.headcount}، مقارنة بالحد المحدد ${s.small}.`,
        evidence: `Headcount = ${u.headcount}، الوظائف الشاغرة = ${u.vacancies}، عدد المديرين = ${u.managers}. وسيط حجم الإدارات = ${g(medHc)}.`,
        recommended: "مراجعة ما إذا كانت الوحدة وظيفة متخصصة مستقلة بطبيعتها، أو قيد التأسيس، أو يمكن ضمها لوحدة ذات صلة.",
        rule: `department headcount <= Small Department Threshold (${s.small})`, metric: "Headcount", value: u.headcount, threshold: s.small,
        benchmark: `Median department headcount = ${g(medHc)}`, related: members });
    if (u.headcount > s.small && u.management_ratio > s.ratio)
      F({ type: "HIGH_MANAGEMENT_RATIO", severity: u.management_ratio <= 2 * s.ratio ? "Attention" : "Significant", entity_type: "Department",
        entity_id: dept, entity_name: dept, department: dept,
        description: `نسبة المديرين في الإدارة ${pct(u.management_ratio)} مقارنة بالحد المحدد ${pct(s.ratio)}.`,
        evidence: `Management Ratio = ${u.managers} مدير ÷ ${u.headcount} موظف = ${pct(u.management_ratio)}. النسبة على مستوى المنظمة = ${pct(orgRatio)}. متوسط Span of Control في الإدارة = ${fmt(u.avg_span, 2)}. عدد الطبقات = ${u.layers}.`,
        recommended: "مراجعة عدد المستويات الإشرافية مقارنة بحجم الفريق، ووجود مديرين بفرق صغيرة جدًا، وإمكانية تبسيط الهيكل.",
        rule: `managers / headcount > High Management Ratio (${pct(s.ratio, 0)})`, metric: "Management Ratio", value: pct(u.management_ratio),
        threshold: pct(s.ratio, 0), benchmark: `Organization ratio = ${pct(orgRatio)}`, related: members });
  }
  // duplicates
  const posCount = groupBy(recs.filter((r) => r.position_id && !r.is_dup), (r) => r.position_id);
  for (const [pid, grp] of posCount) if (grp.length > 1)
    F({ type: "DUPLICATE_POSITION", severity: "Significant", entity_type: "Position", entity_id: pid,
      entity_name: [...new Set(grp.map((r) => r.job_title))].join(", "), department: grp[0].department,
      description: `Position ID ${pid} مسجل لأكثر من سجل (${grp.length} سجلات).`,
      evidence: "السجلات: " + grp.map((r) => `${r.node_id} – ${r.employee_name} (row ${r.row_number})`).join("; "),
      recommended: "التحقق من أن كل موظف مرتبط بوظيفة مستقلة في هيكل الوظائف.",
      rule: "position_id appears on more than one record", metric: "Records", value: grp.length, related: grp.map((r) => r.node_id) });
  const jt = jobTitleAnalysis(recs, s);
  const idsWithTitles = (ts) => recs.filter((r) => ts.includes(r.job_title) && (r.is_active || r.is_vacant)).map((r) => r.node_id);
  for (const v of jt.variants) { const ts = v.variants.split(" | ");
    F({ type: "DUPLICATE_POSITION", severity: "Attention", entity_type: "Job Title", entity_id: v.normalized_title, entity_name: v.variants,
      department: v.departments, description: "مسمى وظيفي مكرر بصيغ كتابة مختلفة (Duplicate Job Title).",
      evidence: `الصيغ: ${v.variants}. عدد الوظائف = ${v.positions}. الإدارات: ${v.departments}.`,
      recommended: "توحيد المسمى في دليل الوظائف (Job Catalogue).",
      rule: "job titles identical after normalising case / spacing / punctuation", metric: "Variants", value: ts.length, related: idsWithTitles(ts) }); }
  for (const p of jt.similar)
    F({ type: "DUPLICATE_POSITION", severity: "Informational", entity_type: "Job Title", entity_id: `${p.title_a} ~ ${p.title_b}`,
      entity_name: `${p.title_a} ~ ${p.title_b}`, department: [...new Set([...p.departments_a.split(", "), ...p.departments_b.split(", ")])].filter(Boolean).sort().join(", "),
      description: "مسميات وظيفية متشابهة نصيًا (Similar Job Titles) قد تشير إلى تداخل أدوار.",
      evidence: `'${p.title_a}' (${p.positions_a} وظيفة؛ ${p.departments_a}) و'${p.title_b}' (${p.positions_b} وظيفة؛ ${p.departments_b}). درجة التشابه = ${p.similarity.toFixed(2)}.`,
      recommended: "مقارنة الوصف الوظيفي للمسميين لتحديد ما إذا كانا دورًا واحدًا أم دورين مختلفين.",
      rule: `text similarity >= ${s.similarity}`, metric: "Similarity", value: p.similarity, threshold: s.similarity, related: idsWithTitles([p.title_a, p.title_b]) });
  // vacancies
  for (const r of recs.filter((x) => x.is_vacant && !x.is_dup)) {
    const has = r.direct + r.vacDirect, managerial = r.job_level != null && r.job_level <= 4;
    F({ type: "VACANT_POSITION", severity: managerial || has ? "Attention" : "Informational", entity_type: "Position", entity_id: r.position_id || r.node_id,
      entity_name: r.job_title || "(no title)", department: r.department,
      description: `وظيفة شاغرة (Position Status = Vacant): ${r.job_title}.`,
      evidence: `Position ID = ${r.position_id}، Job Level = ${lvl(r.job_level)}، تتبع المدير ${r.manager_id || "—"}. وظائف تابعة لهذه الوظيفة = ${has}.`,
      recommended: "التحقق من حالة التوظيف لهذه الوظيفة ومدة شغورها، وأثرها على الفريق." + (managerial ? " الوظيفة ذات مستوى إشرافي." : ""),
      rule: "position_status == 'Vacant'", metric: "Position Status", value: "Vacant", related: [r.node_id] });
  }
  for (const r of recs.filter((x) => x.is_active && x.direct === 0 && x.vacDirect > 0))
    F({ type: "VACANT_POSITION", severity: "Attention", entity_type: "Manager", entity_id: r.node_id, entity_name: nameOf(r), department: r.department,
      description: `مدير بدون موظفين نشطين: جميع الوظائف التابعة له (${r.vacDirect}) شاغرة.`,
      evidence: `Direct Reports النشطون = 0، الوظائف الشاغرة التابعة = ${r.vacDirect}، Job Level = ${lvl(r.job_level)}.`,
      recommended: "مراجعة خطة شغل الفريق أو ما إذا كان الفريق قد نُقل/أُعيد تنظيمه.",
      rule: "active employee with 0 active and >= 1 vacant direct positions", metric: "Vacant direct positions", value: r.vacDirect,
      related: [r.node_id, ...directIds(model, r.node_id, true)] });

  const tRank = Object.fromEntries(FINDING_TYPES.map((t, i) => [t, i]));
  out.sort((a, b) => SEVERITIES.indexOf(a.severity) - SEVERITIES.indexOf(b.severity) || tRank[a.type] - tRank[b.type]
    || String(a.department).localeCompare(String(b.department)) || String(a.entity_id).localeCompare(String(b.entity_id)));
  out.forEach((f, i) => { f.finding_id = "F-" + String(i + 1).padStart(4, "0"); });
  return out;
}

const blank = (k) => (r) => r[k] === "" || r[k] == null;
function dqChecks(model) {
  const ceo = model.ceo;

  const nameOfId = new Map(model.recs.map((r) => [r.node_id, r.employee_name]));

  model.recs.forEach((r) => { if (r.department && r.division) { if (!deptDiv.has(r.department)) deptDiv.set(r.department, new Set()); deptDiv.get(r.department).add(r.division); } });

    if (r.position_id) posCount.set(r.position_id, (posCount.get(r.position_id) || 0) + 1); });

  const filled = (r) => !r.is_vacant, positions = (r) => !r.is_dup, all = () => true;
  const today = new Date().toISOString().slice(0, 10);
  const C = (id, dim, name, field, rule, scope, fails) => ({ id, dim, name, field, rule, scope, fails });
  return [
    C("C01", "Completeness", "Employee ID Completeness", "employee_id", "Employee ID populated for filled positions", filled, blank("employee_id")),
    C("C02", "Completeness", "Employee Name Completeness", "employee_name", "Name populated for filled positions", filled, blank("employee_name")),
    C("C03", "Completeness", "Manager ID Completeness", "manager_id", "Manager ID populated for everyone except the CEO",
      (r) => !r.is_vacant && r.node_id !== ceo && r.employment_status !== "Terminated", blank("manager_id")),
    C("C04", "Completeness", "Job Title Completeness", "job_title", "Job title populated", positions, blank("job_title")),
    C("C05", "Completeness", "Department Completeness", "department", "Department populated", positions, blank("department")),
    C("C06", "Completeness", "Division Completeness", "division", "Division populated", positions, blank("division")),
    C("C07", "Completeness", "Business Unit Completeness", "business_unit", "Business unit populated", positions, blank("business_unit")),
    C("C08", "Completeness", "Job Level Completeness", "job_level", "Job level populated", positions, (r) => r.job_level == null),
    C("C09", "Completeness", "Salary Completeness", "salary", "Salary populated for filled positions", filled, (r) => !isNum(r.salary)),
    C("C10", "Completeness", "Position ID Completeness", "position_id", "Position ID populated", all, blank("position_id")),
    C("C11", "Completeness", "Hire Date Completeness", "hire_date", "Hire date populated for filled positions", filled, blank("hire_date")),
    C("U01", "Uniqueness", "Employee ID Uniqueness", "employee_id", "Each Employee ID appears once", (r) => !r.is_vacant && r.employee_id, (r) => idCount.get(r.employee_id) > 1),
    C("U02", "Uniqueness", "Position ID Uniqueness", "position_id", "Each Position ID appears once", (r) => r.position_id, (r) => posCount.get(r.position_id) > 1),
    C("V01", "Validity", "Salary Validity", "salary", "Salary is a positive number", (r) => !r.is_vacant && isNum(r.salary), (r) => r.salary <= 0),
    C("V02", "Validity", "Job Level Validity", "job_level", "Job level is an integer 0-6", (r) => r.job_level != null, (r) => !(r.job_level >= 0 && r.job_level <= 6) || !Number.isInteger(r.job_level)),
    C("V03", "Validity", "Employment Status Validity", "employment_status", "One of Active, On Leave, Terminated", filled, (r) => !["Active", "On Leave", "Terminated"].includes(r.employment_status)),
    C("V04", "Validity", "Position Status Validity", "position_status", "One of Filled, Vacant", all, (r) => !["Filled", "Vacant"].includes(r.position_status)),
    C("V05", "Validity", "Employment Type Validity", "employment_type", "One of Full-Time, Part-Time, Contractor", (r) => !r.is_vacant && r.employment_type, (r) => !["Full-Time", "Part-Time", "Contractor"].includes(r.employment_type)),
    C("V06", "Validity", "Work Arrangement Validity", "work_arrangement", "One of On-site, Hybrid, Remote", (r) => !r.is_vacant && r.work_arrangement, (r) => !["On-site", "Hybrid", "Remote"].includes(r.work_arrangement)),
    C("V07", "Validity", "Age Validity", "age", "Age between 16 and 80", (r) => isNum(r.age), (r) => r.age < 16 || r.age > 80),
    C("V08", "Validity", "Hire Date Validity", "hire_date", "Hire date is not in the future", (r) => !!r.hire_date, (r) => r.hire_date > today),
    C("V09", "Validity", "Performance Rating Validity", "performance_rating", "Rating between 1 and 5", (r) => isNum(r.performance_rating), (r) => r.performance_rating < 1 || r.performance_rating > 5),
    C("S01", "Consistency", "Terminated Employee / Position Status", "position_status", "Terminated employees should not hold a 'Filled' position", (r) => r.employment_status === "Terminated", (r) => r.position_status === "Filled"),
    C("S02", "Consistency", "Manager Job Level Seniority", "job_level", "Manager's job level is equal or more senior than the employee's",
      (r) => r.is_active && r.manager_id, (r) => { const m = lvlOf.get(r.manager_id); return m != null && r.job_level != null && m > r.job_level; }),
    C("S03", "Consistency", "Manager-level Role Without Reports", "job_level", "Job levels 0-5 are expected to have at least one active direct report",
      (r) => r.is_active && r.job_level != null && r.job_level <= 5, (r) => r.direct === 0),
    C("S04", "Consistency", "Department → Division Mapping", "division", "Each department belongs to exactly one division", positions, (r) => (deptDiv.get(r.department)?.size || 0) > 1),
    C("S05", "Consistency", "Manager Name Matches Manager ID", "manager_name", "Recorded manager name matches the manager's record",
      (r) => r.manager_id && r.manager_name, (r) => { const a = nameOfId.get(r.manager_id); return a && r.manager_name !== "(Vacant)" && a.toLowerCase() !== r.manager_name.toLowerCase(); }),
    C("S06", "Consistency", "Vacant Position Without Employee Data", "employee_name", "Vacant positions carry no employee name", (r) => r.is_vacant, (r) => !!r.employee_name),
    C("S07", "Consistency", "Salary Within Job Level Band", "salary", "Salary within 1.5×IQR of its job level",
      (r) => r.is_active && isNum(r.salary), (r) => { const b = bands.get(r.job_level); return b && (r.salary < b[0] || r.salary > b[1]); }),
    C("R01", "Referential Integrity", "Manager Reference Validity", "manager_id", "Manager ID refers to an existing record", (r) => r.manager_id && (r.is_active || r.is_vacant), (r) => r.status === RS.INVALID),
    C("R02", "Referential Integrity", "Manager Is Active", "manager_id", "Manager record is Active / On Leave (or a vacant position)", (r) => r.is_active && r.manager_id, (r) => r.status === RS.TERMINATED),
    C("R03", "Referential Integrity", "No Circular Reporting", "manager_id", "Reporting chain does not loop", (r) => r.is_active, (r) => r.status === RS.CIRCULAR),
    C("R04", "Referential Integrity", "Reaches the CEO", "manager_id", "Reporting chain reaches the top of the hierarchy", (r) => r.is_active, (r) => r.depth == null),
    C("R05", "Referential Integrity", "Single Top of Hierarchy", "manager_id", "Only one active employee without a manager", (r) => r.is_active && !r.manager_id, (r) => r.node_id !== ceo),
  ];
}
function runChecks(model) {
  return dqChecks(model).map((c) => {

    wrap.innerHTML = `<table><thead><tr>${cols.map((c) => `<th data-k="${c.k}" ${sortK === c.k ? `aria-sort="${dir > 0 ? "ascending" : "descending"}"` : ""}>${esc(c.label)}</th>`).join("")}</tr></thead>

    document.getElementById(id + "-n").textContent = data.length > max ? `${max.toLocaleString("en-US")} من ${data.length.toLocaleString("en-US")} صف معروض (التحميل يشمل الكل)` : `${data.length.toLocaleString("en-US")} صف`;
    wrap.querySelectorAll("th").forEach((th) => th.addEventListener("click", () => {

}
const C = (k, label, t, f) => ({ k, label: label || X.LABELS[k] || k, t, f });

/* ---------------------------------------------------------------- charts (SVG) */
const COL = { a: "var(--accent)", b: "var(--bar-2)", c: "var(--bar-3)", crit: "var(--crit)", sig: "var(--sig)", att: "var(--att)", info: "var(--info)" };
const SEV_COL = { Critical: COL.crit, Significant: COL.sig, Attention: COL.att, Informational: COL.info };
const tipAttr = (t) => `data-tip="${esc(t)}"`;
const niceMax = (v) => { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)); const m = v / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p; };
const ticks = (max, n = 5) => Array.from({ length: n + 1 }, (_, i) => (max / n) * i);
const legend = (items) => `<div class="legend">${items.map(([n, c]) => `<span><i style="background:${c}"></i>${esc(n)}</span>`).join("")}</div>`;

/** Horizontal bars. rows: [{label, values:[...], tip}] series: [[name,color]] ; stacked or grouped */
function hbar(rows, series, { stacked = false, threshold = null, thresholdLabel = "", unit = "", width = 640, labelW = null } = {}) {
  if (!rows.length) return `<p class="note">لا توجد بيانات.</p>`;
  const lw = labelW ?? Math.min(190, Math.max(60, Math.max(...rows.map((r) => String(r.label).length)) * 6.6 + 10));
  const bh = stacked || series.length === 1 ? 16 : 9, gap = 8, rowH = stacked || series.length === 1 ? bh + gap : bh * series.length + gap;
  const H = rows.length * rowH + 34, W = width, pw = W - lw - 30;
  const maxV = niceMax(Math.max(threshold || 0, ...rows.map((r) => (stacked ? X.sum(r.values) : Math.max(...r.values))))) || 1;
  const x = (v) => lw + (v / maxV) * pw;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img">`;
  for (const t of ticks(maxV, 4)) s += `<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="0" y2="${H - 22}"/><text x="${x(t)}" y="${H - 8}" text-anchor="middle">${nfa(t)}${unit}</text>`;
  rows.forEach((r, i) => {
    const y0 = i * rowH + 4;
    s += `<text x="${lw - 8}" y="${y0 + (rowH - gap) / 2 + 4}" text-anchor="end">${esc(String(r.label).slice(0, 30))}</text>`;
    let acc = 0;
    r.values.forEach((v, j) => {
      const y = stacked || series.length === 1 ? y0 : y0 + j * bh, x0 = stacked ? x(acc) : lw, w = Math.max(0, x(v) - lw);
      if (v > 0) s += `<rect x="${x0}" y="${y}" width="${w}" height="${bh - 1}" rx="2" fill="${series[j][1]}" ${tipAttr(r.tip ? r.tip(j) : `${r.label} · ${series[j][0]}: ${nfa(v)}${unit}`)}/>`;
      acc += v;
    });
  });
  if (threshold != null) s += `<line x1="${x(threshold)}" x2="${x(threshold)}" y1="0" y2="${H - 22}" stroke="var(--crit)" stroke-dasharray="4 3"/><text x="${x(threshold) + 4}" y="12" style="fill:var(--crit)">${esc(thresholdLabel)}</text>`;
  return (series.length > 1 ? legend(series) : "") + `<div class="chart">${s}</svg></div>`;
}
/** Vertical histogram. bins: [{x, y, color, tip}] */
function vbar(bins, { xLabel = "", yLabel = "", marks = [], width = 640, height = 260 } = {}) {
  if (!bins.length) return `<p class="note">لا توجد بيانات.</p>`;
  const L = 44, B = 40, W = width, H = height, pw = W - L - 12, ph = H - B - 14;
  const xs = bins.map((b) => b.x), x0 = Math.min(...xs), x1 = Math.max(...xs), n = x1 - x0 + 1, bw = pw / n;
  const maxV = niceMax(Math.max(...bins.map((b) => b.y)));
  const X0 = (v) => L + (v - x0) * bw, Y = (v) => 14 + ph - (v / maxV) * ph;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" role="img">`;
  for (const t of ticks(maxV, 4)) s += `<line class="grid" x1="${L}" x2="${W - 12}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L - 6}" y="${Y(t) + 4}" text-anchor="end">${nfa(t)}</text>`;
  const step = n > 40 ? 5 : n > 20 ? 2 : 1;
  for (let v = x0; v <= x1; v++) if ((v - x0) % step === 0) s += `<text x="${X0(v) + bw / 2}" y="${H - B + 16}" text-anchor="middle">${v}</text>`;
  for (const b of bins) s += `<rect x="${X0(b.x) + 1}" y="${Y(b.y)}" width="${Math.max(1, bw - 2)}" height="${Y(0) - Y(b.y)}" rx="2" fill="${b.color || COL.a}" ${tipAttr(b.tip)}/>`;
  for (const m of marks) { const mx = X0(m.x) + (m.edge ? 0 : bw / 2);
    s += `<line x1="${mx}" x2="${mx}" y1="10" y2="${Y(0)}" stroke="${m.color || "var(--muted)"}" stroke-dasharray="4 3"/><text x="${mx + 3}" y="${m.y || 12}" style="fill:${m.color || "var(--muted)"}">${esc(m.label)}</text>`; }
  s += `<line class="axis" x1="${L}" x2="${W - 12}" y1="${Y(0)}" y2="${Y(0)}"/>`;
  s += `<text x="${L + pw / 2}" y="${H - 4}" text-anchor="middle">${esc(xLabel)}</text><text transform="translate(11 ${14 + ph / 2}) rotate(-90)" text-anchor="middle">${esc(yLabel)}</text>`;
  return `<div class="chart">${s}</svg></div>`;
}
function heatmap(rowsLab, colsLab, z, { width = 640 } = {}) {
  if (!rowsLab.length) return `<p class="note">لا توجد بيانات.</p>`;
  const L = 64, T = 22, cw = (width - L - 8) / colsLab.length, ch = 26, H = T + rowsLab.length * ch + 4;
  const max = Math.max(1, ...z.flat());
  let s = `<svg viewBox="0 0 ${width} ${H}" width="${width}" role="img">`;
  colsLab.forEach((c, j) => { s += `<text x="${L + j * cw + cw / 2}" y="14" text-anchor="middle">${esc(c)}</text>`; });
  rowsLab.forEach((r, i) => { s += `<text x="${L - 6}" y="${T + i * ch + ch / 2 + 4}" text-anchor="end">${esc(r)}</text>`;
    colsLab.forEach((c, j) => { const v = z[i][j], a = v ? 0.12 + 0.88 * Math.sqrt(v / max) : 0;
      s += `<rect x="${L + j * cw + 1}" y="${T + i * ch + 1}" width="${cw - 2}" height="${ch - 2}" rx="3" fill="${v ? "var(--accent)" : "var(--sunken)"}" fill-opacity="${v ? a.toFixed(2) : 1}" ${tipAttr(`${r} · ${c}: ${v} موظف`)}/>`;
      if (v) s += `<text x="${L + j * cw + cw / 2}" y="${T + i * ch + ch / 2 + 4}" text-anchor="middle" style="fill:${a > .55 ? "var(--surface)" : "var(--ink)"}">${v}</text>`; }); });
  return `<div class="chart">${s}</svg></div>`;
}
function scatter(pts, { xLabel = "", yLabel = "", width = 640, height = 300 } = {}) {
  if (!pts.length) return `<p class="note">لا توجد بيانات.</p>`;
  const L = 44, B = 36, pw = width - L - 16, ph = height - B - 12;
  const lx = (v) => Math.log10(Math.max(1, v)), xmax = Math.max(...pts.map((p) => lx(p.x))) * 1.05 || 1, ymax = niceMax(Math.max(...pts.map((p) => p.y)));
  const Xf = (v) => L + (lx(v) / xmax) * pw, Yf = (v) => 12 + ph - (v / ymax) * ph;
  let s = `<svg viewBox="0 0 ${width} ${height}" width="${width}" role="img">`;
  for (const t of ticks(ymax, 4)) s += `<line class="grid" x1="${L}" x2="${width - 16}" y1="${Yf(t)}" y2="${Yf(t)}"/><text x="${L - 6}" y="${Yf(t) + 4}" text-anchor="end">${nfa(t)}</text>`;
  for (const t of [1, 10, 100, 1000, 10000]) if (lx(t) <= xmax) s += `<text x="${Xf(t)}" y="${height - B + 16}" text-anchor="middle">${t}</text>`;
  for (const p of pts) s += `<circle cx="${Xf(p.x)}" cy="${Yf(p.y)}" r="6" fill="var(--accent)" fill-opacity=".8" stroke="var(--surface)" stroke-width="2" ${tipAttr(p.tip)}/><text x="${Xf(p.x)}" y="${Yf(p.y) - 9}" text-anchor="middle" style="font-size:9.5px">${esc(p.label.slice(0, 22))}</text>`;
  s += `<text x="${L + pw / 2}" y="${height - 4}" text-anchor="middle">${esc(xLabel)}</text><text transform="translate(11 ${12 + ph / 2}) rotate(-90)" text-anchor="middle">${esc(yLabel)}</text>`;
  return `<div class="chart">${s}</svg></div>`;
}
/** Treemap: Business Unit -> Department headcount (slice-and-dice). */
function treemap(recs, width = 640, height = 300) {
  const act = recs.filter((r) => r.is_active);
  const bus = [...X.groupBy(act, (r) => X.label(r.business_unit))].sort((a, b) => b[1].length - a[1].length);
  const pal = [COL.a, COL.b, COL.c, "var(--good)", COL.att];
  let s = `<svg viewBox="0 0 ${width} ${height}" width="${width}" role="img">`, x = 0;
  bus.forEach(([bu, rs], i) => {
    const w = (rs.length / act.length) * width; let y = 0;
    const depts = [...X.groupBy(rs, (r) => X.label(r.department))].sort((a, b) => b[1].length - a[1].length);
    depts.forEach(([d, ds]) => { const h = (ds.length / rs.length) * (height - 18);
      s += `<rect x="${x + 1}" y="${18 + y + 1}" width="${Math.max(0, w - 2)}" height="${Math.max(0, h - 2)}" fill="${pal[i % pal.length]}" fill-opacity="${0.35 + 0.5 * (ds.length / rs.length) ** .3}" ${tipAttr(`${bu} › ${d}: ${ds.length} موظف`)}/>`;
      if (h > 13 && w > 60) s += `<text x="${x + 6}" y="${18 + y + 13}" style="font-size:10px;fill:var(--ink)">${esc(d.slice(0, Math.floor(w / 6.2)))} · ${ds.length}</text>`;
      y += h; });
    s += `<text x="${x + 4}" y="12" style="font-weight:600">${esc(bu.slice(0, Math.floor(w / 6.5)))}</text>`;
    x += w;
  });
  return `<div class="chart">${s}</svg></div>`;
}

function spanHist(spans) {
  const s = S.settings, cnt = new Map(); spans.forEach((n) => cnt.set(n, (cnt.get(n) || 0) + 1));
  const cat = (n) => (n <= s.low ? ["Low", COL.b] : n > s.high ? ["High", COL.c] : ["Within Range", COL.a]);
  const bins = [...cnt].map(([x, y]) => ({ x, y, color: cat(x)[1], tip: `${x} موظف مباشر: ${y} مدير (${cat(x)[0]})` }));
  return legend([["Low ≤ " + s.low, COL.b], ["Within Range", COL.a], ["High > " + s.high, COL.c]]) +
    vbar(bins, { xLabel: "عدد الموظفين المباشرين لكل مدير", yLabel: "المديرون",
      marks: [{ x: s.low + 1, edge: true, label: "Low", y: 12 }, { x: s.high + 1, edge: true, label: "High", y: 26 },
        ...(spans.length ? [{ x: Math.round(X.median(spans)), label: "Median " + X.g(X.median(spans)), color: "var(--accent)", y: 40 }] : [])] });
}

function relDepth(m, ids, hint) {
  const roots = [...ids].filter((n) => !ids.has(m.parent.get(n)) || m.parent.get(n) === n);
  if (hint && ids.has(hint) && !roots.includes(hint)) roots.push(hint);
  const d = new Map(); roots.sort().forEach((r) => d.set(r, 0)); let fr = [...roots];
  while (fr.length) { const nx = []; for (const n of fr) for (const c of m.children.get(n) || []) if (ids.has(c) && !d.has(c)) { d.set(c, d.get(n) + 1); nx.push(c); } fr = nx; }
  for (const n of ids) if (!d.has(n)) d.set(n, 0);
  return d;
}
function drawNetwork(ids, rel, color) {
  const m = S.model, s = S.settings, svg = $("#net");
  const kids = new Map([...ids].map((n) => [n, (m.children.get(n) || []).filter((c) => ids.has(c) && rel.get(c) === rel.get(n) + 1).sort()]));
  const roots = [...ids].filter((n) => rel.get(n) === 0).sort();
  const xpos = new Map(); let counter = 0;
  for (const root of roots) { const st = [[root, false]];
    while (st.length) { const [n, done] = st.pop(); const k = kids.get(n) || [];
      if (done || !k.length) { xpos.set(n, k.length ? X.mean(k.map((c) => xpos.get(c))) : counter++); continue; }
      st.push([n, true]); for (let i = k.length - 1; i >= 0; i--) if (!xpos.has(k[i])) st.push([k[i], false]); }
    counter += 0.6; }
  const DX = 22, DY = 120, maxTot = Math.max(1, ...[...ids].map((i) => m.byId.get(i).total));
  const P = (n) => [xpos.get(n) * DX + 20, rel.get(n) * DY + 30];
  let e = "", nodes = "", labels = "";
  for (const n of ids) for (const c of kids.get(n) || []) { const [x0, y0] = P(n), [x1, y1] = P(c), ym = (y0 + y1) / 2;
    e += `M${x0} ${y0}V${ym}H${x1}V${y1}`; }
  const maxD = Math.max(1, ...[...ids].map((i) => m.byId.get(i).depth ?? 0));
  for (const n of ids) { const r = m.byId.get(n), [x, y] = P(n), rad = 5 + 12 * Math.sqrt(r.total / maxTot);
    let fill;
    if (color === "depth") fill = `color-mix(in srgb, var(--accent) ${Math.round(100 - 70 * ((r.depth ?? maxD) / maxD))}%, var(--surface))`;
    else fill = r.is_vacant ? "var(--surface)" : !r.isMgr ? "var(--line)" : r.direct <= s.low ? COL.b : r.direct > s.high ? COL.c : COL.a;
    nodes += `<circle cx="${x}" cy="${y}" r="${rad.toFixed(1)}" fill="${fill}" stroke="${r.is_vacant ? "var(--muted)" : "var(--surface)"}" stroke-width="1.5" ${tipAttr(`${n} – ${r.employee_name || "(Vacant)"}\n${r.job_title} · ${r.department}\nDirect ${r.direct} · Total ${r.total} · Depth ${r.depth ?? "—"}\n${r.status}`)}/>`;
    if (rel.get(n) === 0 || ids.size <= 60) labels += `<text x="${x}" y="${y - rad - 4}" text-anchor="middle">${esc(String(r.job_title).slice(0, 26))}</text>`; }
  const W = Math.max(400, counter * DX + 40), H = (Math.max(...rel.values()) + 1) * DY + 40;
  svg.innerHTML = `<g id="netg"><path d="${e}" fill="none" stroke="var(--line)" stroke-width="1"/>${nodes}${labels}</g>`;
  let vb = [0, 0, W, H]; const set = () => svg.setAttribute("viewBox", vb.map((v) => v.toFixed(1)).join(" "));
  const fit = () => { const ar = svg.clientWidth / svg.clientHeight || 2; const w = Math.max(W, H * ar), h2 = w / ar; vb = [(W - w) / 2, (H - h2) / 2, w, h2]; set(); };
  fit();
  const zoom = (f, cx = vb[0] + vb[2] / 2, cy = vb[1] + vb[3] / 2) => { vb = [cx - (cx - vb[0]) * f, cy - (cy - vb[1]) * f, vb[2] * f, vb[3] * f]; set(); };
  svg.addEventListener("wheel", (ev) => { ev.preventDefault(); const rct = svg.getBoundingClientRect();
    zoom(ev.deltaY > 0 ? 1.15 : 1 / 1.15, vb[0] + ((ev.clientX - rct.left) / rct.width) * vb[2], vb[1] + ((ev.clientY - rct.top) / rct.height) * vb[3]); }, { passive: false });
  let drag = null;
  svg.addEventListener("pointerdown", (ev) => { drag = [ev.clientX, ev.clientY, vb[0], vb[1]]; svg.setPointerCapture(ev.pointerId); });
  svg.addEventListener("pointermove", (ev) => { if (!drag) return; const k = vb[2] / svg.clientWidth; vb[0] = drag[2] - (ev.clientX - drag[0]) * k; vb[1] = drag[3] - (ev.clientY - drag[1]) * k; set(); });
  svg.addEventListener("pointerup", () => (drag = null));

  after(() => { document.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => { S.scenario.splice(+b.dataset.del, 1); S.sim = null; render(); }));

  const key = JSON.stringify(S.scenario) + JSON.stringify(S.settings);

    catch (e) { if (!(e instanceof X.SimError)) console.error(e); S.sim = null; return h + `<p class="err" style="margin-top:12px">تعذر تطبيق السيناريو: ${esc(e.message)}</p>`; }

    <div><h3>Findings قبل وبعد</h3>${table(fRows, [C("t", "Finding Type"), C("b", "Before", "n"), C("a", "After", "n"), C("d", "Change", "n")], { file: "scenario_findings", height: 300 })}</div></div>

      C("management_ratio_before", "Ratio Before", "pct"), C("management_ratio_after", "Ratio After", "pct"), C("layers_before", "Layers Before", "n"), C("layers_after", "Layers After", "n"), C("avg_span_before", "Span Before", "n"), C("avg_span_after", "Span After", "n")], { file: "scenario_departments", height: 300 })}

function parseCSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  const delim = (text.split("\n")[0].match(/;/g) || []).length > (text.split("\n")[0].match(/,/g) || []).length ? ";" : ",";
  for (let i = 0; i < text.length; i++) { const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true; else if (ch === delim) { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch; }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const hdr = (rows.shift() || []).map((x) => x.replace(/^﻿/, "").trim());
  return rows.filter((r) => r.some((x) => x.trim() !== "")).map((r) => Object.fromEntries(hdr.map((h, i) => [h, r[i] ?? ""])));
}
function readFile(file) {
  const out = $("#imp-res"); out.innerHTML = `<p class="note">جاري القراءة…</p>`;
  const done = (rows) => {
    const rep = X.validateImport(rows);
    let h = `<h3 style="margin-top:12px">نتيجة التحقق — ${nf(rows.length)} سجل</h3><div id="valtab"></div>`;
    h += rep.ok ? `<button class="btn primary" id="useimp">تحميل البيانات للتحليل</button>` : `<p class="err">لا يمكن تحليل الملف قبل معالجة الأخطاء (Error) أعلاه. العمودان الأساسيان: EmployeeID و ManagerID.</p>`;
    out.innerHTML = h;
    afterQ = []; tableSeq = 100; $("#valtab").innerHTML = table(rep.issues, [C("level", "Level"), C("field", "Field", "mono"), C("message", "Message", "wrap"), C("count", "Count", "n"), C("rows", "Rows (first 20)")], { file: "validation" });
    afterQ.forEach((f) => f());
    if (rep.ok) $("#useimp").onclick = () => { setData(rows, `ملف مرفوع · ${file.name} · ${nf(rows.length)} سجل`); renderRail(); location.hash = "#dashboard"; render(); };
  };
  const reader = new FileReader();
  if (/\.(xlsx|xlsm|xls)$/i.test(file.name)) {
    if (typeof XLSX === "undefined") { out.innerHTML = `<p class="err">قراءة Excel تحتاج اتصالًا بالإنترنت لتحميل مكتبة SheetJS. احفظ الملف بصيغة CSV وأعد المحاولة.</p>`; return; }
    reader.onload = () => { try { const wb = XLSX.read(reader.result, { type: "array", cellDates: true }); done(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "", raw: false })); }
      catch (e) { out.innerHTML = `<p class="err">تعذر قراءة الملف: ${esc(e.message)}</p>`; } };
    reader.readAsArrayBuffer(file);
  } else { reader.onload = () => { try { done(parseCSV(String(reader.result))); } catch (e) { out.innerHTML = `<p class="err">تعذر قراءة الملف: ${esc(e.message)}</p>`; } }; reader.readAsText(file, "utf-8"); }
}
function exportSheets(useFilters) {
  const v = view(), recs = useFilters ? v.recs : S.model.recs, fs = useFilters ? v.findings : S.findings, s = S.settings;
  const emp = recs.map((r) => Object.fromEntries([["node_id", r.node_id], ...X.COLUMNS.map((c) => [c, r[c]]), ["reporting_status", r.status], ["depth", r.depth], ["direct_reports", r.direct], ["vacant_direct", r.vacDirect], ["total_reports", r.total], ["is_manager", r.isMgr]]));
  const mg = recs.filter((r) => r.isMgr).map((r) => ({ manager_id: r.node_id, name: r.employee_name, job_title: r.job_title, job_level: r.job_level, department: r.department, depth: r.depth, direct_reports: r.direct, vacant_direct: r.vacDirect, total_reports: r.total, span_category: X.spanCat(r.direct, s) }));
  const st = X.spanStats(recs.filter((r) => r.isMgr).map((r) => r.direct));
  return { Employees: emp, Managers: mg, Departments: X.unitMetrics(recs, "department", s),
    Findings: fs.map(({ related, ...f }) => ({ ...f, related_ids: related.slice(0, 50).join(", ") })),
    "Span of Control": Object.entries(st).map(([k, v]) => ({ statistic: k, value: v })),
    "Organizational Layers": [...X.layerMetrics(recs, "job_level").map((l) => ({ basis: "Job Level", ...l })), ...X.layerMetrics(recs, "depth").map((l) => ({ basis: "Structural Depth", ...l }))],
    "Data Quality": dq().map(({ failing, ...c }) => c) };
}

function pageSettings() {
